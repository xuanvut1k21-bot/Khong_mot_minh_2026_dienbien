name: Temporary sharp lockfile bootstrap
on:
  push:
    branches: [feat/reproducible-dependency-security]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Regenerate package lock (do not install scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export lockfile for reviewable commit
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('package-lock.json').toString('base64');console.log('SHARP_LOCK_BEGIN');for(let i=0;i<b.length;i+=500)console.log('SHARP_LOCK_CHUNK:'+b.slice(i,i+500));console.log('SHARP_LOCK_END')"
