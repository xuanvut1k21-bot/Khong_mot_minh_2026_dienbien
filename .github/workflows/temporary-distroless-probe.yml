name: Temporary distroless runtime feasibility probe
on:
  push:
    branches: [feat/container-image-supply-chain-scan]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check distroless Node 22 Debian 13 manifest
        run: |
          set -euo pipefail
          for ref in \
            "gcr.io/distroless/nodejs22-debian13:nonroot" \
            "gcr.io/distroless/nodejs22-debian12:nonroot" \
            "docker.io/library/node:22-alpine"; do
            echo "PROBE_REF=$ref"
            docker buildx imagetools inspect "$ref" 2>&1 | head -15 || true
          done
      - name: Scan minimal distroless runtime OS CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gcr.io/distroless/nodejs22-debian13:nonroot
          scan-type: image
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
          format: table
          cache: "false"
