name: Website checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: km_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d km_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/km_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run training:unit
      - run: npm run staging:test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Validate PostgreSQL migration and visibility
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_public_content.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/public-content.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/002_admin_auth.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/admin-auth.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/003_activity_review.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/activity-workflow.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/004_media_curation.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/media-curation.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/005_safe_image_uploads.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/safe-image-upload.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/006_pdf_video_previews.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/pdf-video-previews.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/007_training_foundation.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/training-foundation.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/008_training_editorial.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/training-editorial.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/009_training_survey_handoffs.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/training-survey-handoffs.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/010_training_operational_security.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/training-operational-security.sql

      - name: Integration training journey (synthetic users and signed mock survey)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/km_test
          APP_BASE_URL: http://localhost:4127
          TRAINING_PRIVACY_NOTICE_URL: https://privacy.example.test/training
          TRAINING_REGISTRATION_ENABLED: "true"
          TRAINING_EXAM_ENABLED: "true"
          TRAINING_SURVEY_WEBHOOK_ENABLED: "true"
          TRAINING_SURVEY_LAUNCH_ENABLED: "true"
          TRAINING_SURVEY_WEBHOOK_SECRET: "ci-synthetic-HMAC-key-not-for-production-0123456789"
          TRAINING_SURVEY_PROVIDER_HOST: surveys.example.test
          TRAINING_SURVEY_1_URL: https://surveys.example.test/lesson-1
          TRAINING_SURVEY_9_URL: https://surveys.example.test/lesson-9
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run training:journey

      - name: Verify maintenance dry-run and approved CI-only purge
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/km_test
          TRAINING_LEARNER_RETENTION_DAYS: "180"
        run: npm run training:maintenance-test

      - name: Build disposable staging image (no registry or deploy)
        run: docker build --pull --tag km2026-staging:ci .
      - name: Smoke-test isolated production-mode container without secrets
        run: |
          docker run -d --rm --name km2026-ci \
            --user 1001:1001 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m,mode=1777 \
            --tmpfs /app/.next/cache:rw,nosuid,size=64m \
            --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 \
            -p 127.0.0.1:4128:3000 km2026-staging:ci
          trap 'docker rm -f km2026-ci >/dev/null 2>&1 || true' EXIT
          ok=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4128/api/health/live >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          live=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4128/api/health/live)
          ready=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4128/api/health/ready)
          test "$live" = 200
          test "$ready" = 503
          curl --fail --silent http://127.0.0.1:4128/api/v1/training/overview | grep -q '"registrationOpen":false'
          echo "Staging container: live 200, DB readiness 503, training registration closed."
